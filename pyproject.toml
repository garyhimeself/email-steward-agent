[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-steward"
version = "0.1.0"
description = "Portable local workspace foundation for Email Steward"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25,<27; platform_system == 'Windows' or platform_system == 'Darwin'",
]

[tool.setuptools.packages.find]
where = ["src"]
